name: Bug report
description: Help improve the preview with reproducible steps. English or Chinese welcome.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, private file contents, or unsanitized logs."
  - type: input
    id: environment
    attributes:
      label: Operating system and program version
      placeholder: Windows 11 / commit or version number
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model provider and model ID (if applicable; no API keys)
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized errors or screenshots
