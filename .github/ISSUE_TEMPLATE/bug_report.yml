name: 使用问题 / Bug report
description: 提供复现步骤，帮助我们改进早期体验。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "请勿提交 API Key、个人文件内容或未脱敏的完整日志。"
  - type: input
    id: environment
    attributes:
      label: 系统与程序版本
      placeholder: Windows 11 / commit 或版本号
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 模型服务与模型 ID（如适用，不要填密钥）
  - type: textarea
    id: steps
    attributes:
      label: 如何复现？
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的错误或截图
