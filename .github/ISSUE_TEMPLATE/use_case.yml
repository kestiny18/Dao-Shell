name: Use case
description: Tell us what you want to do with your computer. English or Chinese welcome.
title: "[Use case] "
body:
  - type: textarea
    id: task
    attributes:
      label: What do you want to accomplish?
      description: Describe a concrete computer-use situation.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: How do you do it today, and which step is frustrating?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: How would you like to interact?
      description: Write something you would say to Dao-Shell, or describe the confirmations you need.
