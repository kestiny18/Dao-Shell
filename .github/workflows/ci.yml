name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: cargo fmt --check
      - if: runner.os == 'Windows'
        run: ./scripts/check-ci-windows-token.ps1
      - run: cargo test --locked --all-targets -- --nocapture
      - if: runner.os == 'Windows'
        run: cargo clippy --locked --all-targets -- -D warnings
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: ./scripts/check-ci-windows-token.ps1
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked -- --nocapture
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo build --manifest-path desktop/src-tauri/Cargo.toml --locked
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
