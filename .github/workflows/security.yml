name: Dependency security
on:
  push:
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file Cargo.lock --deny unsound
      # Full desktop report retained in logs. GTK glib is outside Windows release target;
      # see docs/DEPENDENCY_SECURITY.md before changing this exception.
      - run: cargo audit --file desktop/src-tauri/Cargo.lock
      - run: cargo audit --file desktop/src-tauri/Cargo.lock --deny unsound --ignore RUSTSEC-2024-0429
      - run: npm ci --prefix desktop
      - run: npm audit --prefix desktop
