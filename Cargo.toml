[package]
name = "dao-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A small LLM-first shell for using your computer"
repository = "https://github.com/kestiny18/Dao-Shell"
readme = "README.md"
license = "Apache-2.0"
publish = false

[[bin]]
name = "daosh"
path = "src/main.rs"

[[bin]]
name = "dao-index-worker"
path = "src/bin_index_worker.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
rpassword = "7"
rusqlite = { version = "0.40", default-features = false, features = ["libsqlite3-sys", "bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.39"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
notify = "8.2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-collections = "0.3"
windows-future = "0.3"
windows = { version = "0.62.2", features = ["Foundation", "System", "Security_Cryptography_Certificates", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
base64 = "0.22"
png = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Services", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_System_Com", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Environment", "Win32_Security_Authorization", "Win32_System_Ioctl", "Win32_System_Registry", "Win32_System_Power", "Win32_System_Performance", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
native-tls = "0.2"

[profile.release]
lto = "thin"
strip = true
