[package]
name = "dao-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A small LLM-first shell for using your computer"
repository = "https://github.com/kestiny18/Dao-Shell"
readme = "README.md"
license = "Apache-2.0"
publish = false

[[bin]]
name = "daosh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
rpassword = "7"
rusqlite = { version = "0.40", default-features = false, features = ["libsqlite3-sys", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
png = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Credentials", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Registry", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
# Experimental directory notifications; not part of the production Shell runtime.
notify = "8.2"
